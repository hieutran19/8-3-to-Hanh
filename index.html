<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chúc Mừng 8/3 Đến Hạnh 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --pink-bg: #ffd6e7;
            --pink-light: #ffe4f0;
            --pink-card: rgba(255, 255, 255, 0.55);
            --pink-deep: #ff6fa8;
            --pink-mid: #ff9ec6;
            --pink-text: #d63a7a;
            --pink-shadow: rgba(255, 111, 168, 0.25);
            --teal: #5ecfcf;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--pink-bg);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        .bg-hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-hearts span {
            position: absolute;
            display: block;
            font-size: 1.2rem;
            opacity: 0.18;
            animation: floatHeart linear infinite;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.18;
            }

            100% {
                transform: translateY(-10vh) rotate(30deg);
                opacity: 0;
            }
        }

        .page {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* HOME */
        #home {
            padding: 24px 16px 40px;
            gap: 16px;
        }

        .home-title {
            font-family: 'Pacifico', cursive;
            font-size: 2rem;
            color: var(--pink-deep);
            text-shadow: 0 2px 10px var(--pink-shadow);
            margin-bottom: 8px;
            text-align: center;
            animation: popIn 0.6s cubic-bezier(.36, 1.56, .64, 1) both;
        }

        .home-subtitle {
            font-size: 0.9rem;
            color: var(--pink-text);
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            animation: popIn 0.6s 0.1s cubic-bezier(.36, 1.56, .64, 1) both;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.7) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .menu-cards {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 340px;
        }

        .menu-card {
            background: var(--pink-card);
            backdrop-filter: blur(8px);
            border-radius: 22px;
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1.5px solid rgba(255, 160, 200, 0.35);
            box-shadow: 0 6px 24px var(--pink-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: popIn 0.6s cubic-bezier(.36, 1.56, .64, 1) both;
            position: relative;
            overflow: hidden;
        }

        .menu-card:nth-child(1) {
            animation-delay: 0.15s;
        }

        .menu-card:nth-child(2) {
            animation-delay: 0.28s;
        }

        .menu-card:nth-child(3) {
            animation-delay: 0.41s;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 200, 225, 0.1));
            pointer-events: none;
        }

        .menu-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 36px var(--pink-shadow);
        }

        .menu-card:active {
            transform: scale(0.97);
        }

        .menu-card .icon {
            font-size: 2.8rem;
            filter: drop-shadow(0 2px 6px var(--pink-shadow));
        }

        .menu-card .label {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--pink-deep);
            letter-spacing: 0.5px;
        }

        .deco {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.5;
            pointer-events: none;
        }

        /* MUSIC PAGE */
        #music {
            background: linear-gradient(160deg, #ffd6e7 0%, #ffb3d1 100%);
            padding: 24px 16px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 24px 20px 28px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 40px rgba(255, 100, 160, 0.25);
            border: 1.5px solid rgba(255, 180, 215, 0.5);
            animation: popIn 0.5s cubic-bezier(.36, 1.56, .64, 1) both;
            position: relative;
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .player-header span {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--pink-text);
            text-transform: uppercase;
        }

        .player-header .note {
            font-size: 1.1rem;
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 18px;
            position: relative;
            box-shadow: 0 6px 24px rgba(255, 100, 160, 0.3);
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-art .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(255, 80, 140, 0.3));
        }

        .track-title {
            text-align: center;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--pink-text);
            margin-bottom: 12px;
        }

        .progress-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .progress-bar .time {
            font-size: 0.72rem;
            color: #aaa;
            font-weight: 600;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: #f5c0d8;
            border-radius: 99px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--pink-deep), var(--teal));
            border-radius: 99px;
            width: 2%;
            transition: width 0.5s linear;
        }

        .progress-dot {
            width: 10px;
            height: 10px;
            background: var(--pink-deep);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            left: 2%;
            transition: left 0.5s linear;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 20px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.6rem;
            color: #ccc;
            transition: color 0.2s, transform 0.15s;
            line-height: 1;
        }

        .ctrl-btn:hover {
            color: var(--pink-deep);
            transform: scale(1.15);
        }

        .play-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink-deep), #ff9ec6);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: white;
            box-shadow: 0 4px 16px rgba(255, 100, 160, 0.45);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 24px rgba(255, 100, 160, 0.6);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            border: 1px solid transparent;
        }

        .playlist-item:hover {
            background: rgba(255, 180, 215, 0.4);
            transform: translateX(4px);
        }

        .playlist-item.active {
            background: rgba(255, 100, 160, 0.15);
            border-color: rgba(255, 100, 160, 0.3);
        }

        .playlist-thumb {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .playlist-info .pname {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--pink-text);
        }

        .playlist-info .partist {
            font-size: 0.72rem;
            color: #bbb;
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--pink-deep);
            border: none;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--pink-shadow);
            transition: transform 0.15s;
        }

        .close-btn:hover {
            transform: scale(1.1);
        }

        /* LETTER PAGE */
        #letter {
            background: linear-gradient(160deg, #ffe0ee 0%, #ffc8de 100%);
            padding: 24px 16px;
        }

        .letter-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 28px 24px 32px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 40px rgba(255, 100, 160, 0.25);
            border: 1.5px solid rgba(255, 180, 215, 0.5);
            animation: popIn 0.5s cubic-bezier(.36, 1.56, .64, 1) both;
            position: relative;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        .letter-content {
            flex: 1;
            font-size: 0.97rem;
            line-height: 1.85;
            color: #c04a7a;
            font-weight: 500;
            white-space: pre-wrap;
            min-height: 300px;
        }

        .letter-content .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--pink-deep);
            margin-left: 1px;
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .letter-bear {
            position: absolute;
            bottom: 16px;
            right: 20px;
            font-size: 2.5rem;
            filter: drop-shadow(0 2px 6px var(--pink-shadow));
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* BACK BUTTON */
        .back-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 160, 200, 0.4);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--pink-deep);
            box-shadow: 0 2px 10px var(--pink-shadow);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .back-btn.show {
            display: flex;
        }

        .back-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 18px var(--pink-shadow);
        }

        /* ===== IMAGE PAGE ===== */
        #image-page {
            background: linear-gradient(160deg, #ffd6e7 0%, #ffb3d1 100%);
            padding: 24px 16px;
            gap: 16px;
            overflow: hidden;
        }

        /* CAROUSEL WRAPPER */
        .carousel-wrapper {
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            padding: 20px 0 30px;
        }

        .carousel-track {
            display: flex;
            gap: 24px;
            will-change: transform;
        }

        .polaroid {
            background: white;
            border-radius: 12px;
            padding: 12px 12px 42px;
            box-shadow: 0 8px 30px rgba(255, 100, 160, 0.3);
            width: 170px;
            flex-shrink: 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .polaroid:nth-child(1),
        .polaroid:nth-child(4) {
            transform: rotate(-4deg);
        }

        .polaroid:nth-child(2),
        .polaroid:nth-child(5) {
            transform: rotate(3deg);
        }

        .polaroid:nth-child(3),
        .polaroid:nth-child(6) {
            transform: rotate(-2deg);
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.08) translateY(-6px) !important;
            box-shadow: 0 16px 40px rgba(255, 100, 160, 0.45);
            z-index: 10;
        }

        .polaroid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .polaroid-label {
            text-align: center;
            margin-top: 10px;
            font-family: 'Pacifico', cursive;
            font-size: 0.82rem;
            color: var(--pink-text);
        }

        /* Fade edges */
        .carousel-wrapper::before,
        .carousel-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 48px;
            z-index: 2;
            pointer-events: none;
        }

        .carousel-wrapper::before {
            left: 0;
            background: linear-gradient(to right, #ffb3d1 0%, transparent 100%);
        }

        .carousel-wrapper::after {
            right: 0;
            background: linear-gradient(to left, #ffb3d1 0%, transparent 100%);
        }

        /* Dots indicator */
        .carousel-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 4px;
        }

        .carousel-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--pink-mid);
            opacity: 0.5;
            animation: dotPulse 2s ease-in-out infinite;
        }

        .carousel-dots span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .carousel-dots span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes dotPulse {

            0%,
            100% {
                opacity: 0.35;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        /* Particles */
        .heart-particle {
            position: fixed;
            pointer-events: none;
            font-size: 1.2rem;
            z-index: 9999;
            animation: particleFly 0.8s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0.3);
            }
        }
    </style>
</head>

<body>

    <div class="bg-hearts" id="bgHearts"></div>

    <button class="back-btn" id="backBtn" onclick="goHome()">←</button>

    <!-- HOME -->
    <div class="page active" id="home">
        <div class="home-title">Chúc Hạnh 8/3 nhiều niềm vui 💕</div>

        <div class="menu-cards">
            <div class="menu-card" onclick="goPage('music'); spawnHearts(event)">
                <span class="deco" style="top:8px;right:14px">🌸</span>
                <div class="icon">🎵</div>
                <div class="label">Music</div>
            </div>
            <div class="menu-card" onclick="goPage('letter'); spawnHearts(event)">
                <span class="deco" style="bottom:8px;left:14px">🌼</span>
                <div class="icon">💌</div>
                <div class="label">Letter</div>
            </div>
            <div class="menu-card" onclick="goPage('image-page'); spawnHearts(event)">
                <span class="deco" style="top:8px;left:14px">🌷</span>
                <div class="icon">🖼️</div>
                <div class="label">Image</div>
            </div>
        </div>
    </div>

    <!-- MUSIC -->
    <div class="page" id="music">
        <div class="player-card">
            <button class="close-btn" onclick="goHome()">✕</button>
            <div class="player-header">
                <span class="note">🎵</span>
                <span>MUSIC PLAYER</span>
            </div>
            <div class="album-art">
                <img id="albumImg" src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=400&q=80"
                    alt="album" />
                <div class="overlay"></div>
            </div>
            <div class="track-title" id="trackTitle">Nơi Này Có Anh</div>
            <div class="progress-bar">
                <span class="time" id="curTime">0:01</span>
                <div class="progress-track" id="progressTrack" onclick="seekTrack(event)">
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-dot" id="progressDot"></div>
                </div>
                <span class="time" id="durTime">4:01</span>
            </div>
            <div class="controls">
                <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
                <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
            </div>
            <div class="playlist" id="playlist"></div>
        </div>
        <audio id="audioPlayer"></audio>
    </div>

    <!-- LETTER -->
    <div class="page" id="letter">
        <div class="letter-card">
            <button class="close-btn" onclick="goHome()">✕</button>
            <div class="letter-content" id="letterContent"></div>
            <div class="letter-bear">🐻</div>
        </div>
    </div>

    <!-- IMAGE PAGE -->
    <div class="page" id="image-page">
        <div style="text-align:center; margin-bottom:4px;">
            <div class="home-title" style="font-size:1.5rem">Kỷ Niệm 💝</div>
        </div>

        <!-- CAROUSEL -->
        <div class="carousel-wrapper">
            <div class="carousel-track" id="carouselTrack">
                <!-- 8 ảnh gốc -->
                <div class="polaroid">
                    <img src="img/hanh-1.png" alt="memory1" />
                    <div class="polaroid-label">Chúc Hạnh 💕</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-2.png" alt="memory2" />
                    <div class="polaroid-label">8/3 🌸</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-3.png" alt="memory3" />
                    <div class="polaroid-label">Luôn rạng rỡ 💖</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-4.png" alt="memory4" />
                    <div class="polaroid-label">Xinh đẹp 🌷</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-5.png" alt="memory5" />
                    <div class="polaroid-label">Và 💗</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-6.png" alt="memory6" />
                    <div class="polaroid-label">Tràn đầy năng lượng 💝</div>
                </div>

                <!-- Clone 8 ảnh để loop liền mạch -->
                <div class="polaroid">
                    <img src="img/hanh-1.png" alt="memory1" />
                    <div class="polaroid-label">Chúc Hạnh 💕</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-2.png" alt="memory2" />
                    <div class="polaroid-label">8/3 🌸</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-3.png" alt="memory3" />
                    <div class="polaroid-label">Luôn rạng rỡ 💖</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-4.png" alt="memory4" />
                    <div class="polaroid-label">Xinh đẹp 🌷</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-5.png" alt="memory5" />
                    <div class="polaroid-label">Và 💗</div>
                </div>
                <div class="polaroid">
                    <img src="img/hanh-6.png" alt="memory6" />
                    <div class="polaroid-label">Tràn đầy năng lượng 💝</div>
                </div>

            </div>
        </div>

        <div class="carousel-dots">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <button onclick="goHome()"
            style="margin-top:20px;background:rgba(255,255,255,0.6);border:1.5px solid rgba(255,160,200,0.4);padding:10px 28px;border-radius:99px;color:var(--pink-deep);font-family:'Quicksand',sans-serif;font-weight:700;cursor:pointer;font-size:0.95rem;">←
            Quay lại</button>
    </div>

    <script>
        // FLOATING HEARTS
        const emojis = ['💕', '🌸', '💗', '🌷', '💓', '✨', '🌼', '💝'];
        const bg = document.getElementById('bgHearts');
        for (let i = 0; i < 22; i++) {
            const s = document.createElement('span');
            s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            s.style.left = Math.random() * 100 + 'vw';
            s.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
            s.style.animationDuration = (6 + Math.random() * 10) + 's';
            s.style.animationDelay = (-Math.random() * 12) + 's';
            bg.appendChild(s);
        }

        // NAVIGATION
        function goPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('backBtn').classList.add('show');
            if (id === 'letter') startLetter();
            if (id === 'music') initPlayer();
            window.scrollTo(0, 0);
        }

        function goHome() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('home').classList.add('active');
            document.getElementById('backBtn').classList.remove('show');
            stopMusic();
        }

        // HEART PARTICLES
        function spawnHearts(e) {
            const x = e.clientX, y = e.clientY;
            for (let i = 0; i < 7; i++) {
                const h = document.createElement('div');
                h.classList.add('heart-particle');
                h.textContent = ['💕', '💗', '💖', '🌸'][Math.floor(Math.random() * 4)];
                h.style.left = x + 'px'; h.style.top = y + 'px';
                const angle = (Math.random() * 360) * Math.PI / 180;
                const dist = 40 + Math.random() * 60;
                h.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                h.style.setProperty('--dy', Math.sin(angle) * dist - 40 + 'px');
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 800);
            }
        }

        // MUSIC PLAYER
        const tracks = [
            { name: "Nơi Này Có Anh", artist: "Sơn Tùng M-TP", img: "img/hanh-1.png", duration: 241, src: "music/noi-nay-co-anh.mp3" },
            { name: "Thu Cuối", artist: "Yanbi & Hằng BingBoong", img: "img/hanh-2.png", duration: 198, src: "music/thu-cuoi.mp4" },
            { name: "Quá Lâu", artist: "Vinh Khuất", img: "img/hanh-3.png", duration: 275, src: "music/qua-lau.mp3" },
            { name: "Mãi mãi bên nhau", artist: "Noo Phước Thịnh", img: "img/hanh-5.png", duration: 275, src: "music/mai-mai-ben-nhau.mp3" }
        ];

        let curTrack = 0, isPlaying = false, curSec = 1, timer = null;

        function initPlayer() { renderPlaylist(); renderTrack(); }
        const audio = document.getElementById("audioPlayer");
        audio.addEventListener("ended", () => {
            nextTrack();
            audio.play();
            document.getElementById('playBtn').textContent = '⏸';
        });
        function renderPlaylist() {
            const pl = document.getElementById('playlist');
            pl.innerHTML = tracks.map((t, i) => `
                <div class="playlist-item ${i === curTrack ? 'active' : ''}" onclick="selectTrack(${i})">
                    <img class="playlist-thumb" src="${t.img}" alt="${t.name}"/>
                    <div class="playlist-info">
                        <div class="pname">${t.name}</div>
                        <div class="partist">${t.artist}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderTrack() {
            const t = tracks[curTrack];

            document.getElementById('albumImg').src = t.img;
            document.getElementById('trackTitle').textContent = t.name;

            audio.src = tracks[curTrack].src;

            audio.onloadedmetadata = () => {
                document.getElementById('durTime').textContent = fmtTime(audio.duration);
            };

            renderPlaylist();
        }

        function fmtTime(time) {
            const totalSeconds = Math.floor(time);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }

        function updateProgress() {
            const dur = tracks[curTrack].duration;
            const pct = (curSec / dur) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressDot').style.left = pct + '%';
            document.getElementById('curTime').textContent = fmtTime(curSec);
        }

        function togglePlay() {
            isPlaying = !isPlaying;

            if (isPlaying) {
                audio.play();
                document.getElementById('playBtn').textContent = '⏸';
            } else {
                audio.pause();
                document.getElementById('playBtn').textContent = '▶';
            }
        }
        audio.ontimeupdate = () => {
            curSec = audio.currentTime;
            const dur = audio.duration;

            const pct = (curSec / dur) * 100;

            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressDot').style.left = pct + '%';

            document.getElementById('curTime').textContent = fmtTime(curSec);
        };

        function stopMusic() {
            isPlaying = false; clearInterval(timer);
            if (document.getElementById('playBtn')) document.getElementById('playBtn').textContent = '▶';
        }

        function selectTrack(i) { clearInterval(timer); isPlaying = false; curTrack = i; curSec = 0; renderTrack(); document.getElementById('playBtn').textContent = '▶'; }
        function nextTrack() {
            curTrack = (curTrack + 1) % tracks.length;
            renderTrack();

            if (isPlaying) {
                audio.play();
            }

            clearInterval(timer); isPlaying = false; curTrack = (curTrack + 1) % tracks.length; curSec = 0; renderTrack(); document.getElementById('playBtn').textContent = '▶';
        }
        function prevTrack() {
            curTrack = (curTrack - 1 + tracks.length) % tracks.length;
            renderTrack();

            if (isPlaying) {
                audio.play();
            }
            clearInterval(timer);
            isPlaying = false;
            curTrack = (curTrack - 1 + tracks.length) % tracks.length; curSec = 0; renderTrack(); document.getElementById('playBtn').textContent = '▶';
        }
        function seekTrack(e) {
            const rect = document.getElementById('progressTrack').getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        }

        // LETTER
        const letterText = `Gửi Hạnh nhân dịp International Women's Day 💕

Nhân dịp ngày 8/3, xin gửi đến Hạnh những lời chúc tốt đẹp và chân thành nhất.

Chúc Hạnh luôn vui vẻ, mạnh khỏe, giữ mãi nụ cười rạng rỡ và sự tự tin của mình.

Mong rằng mỗi ngày trôi qua đều mang đến cho Hạnh nhiều niềm vui, những trải nghiệm ý nghĩa và thật nhiều điều tốt đẹp trong cuộc sống.

Chúc Hạnh có một ngày 8/3 thật trọn vẹn, hạnh phúc và đáng nhớ. 💝
`;

        let letterTimer = null;

        // ── CAROUSEL ENGINE ──
        // Dùng JS để scroll liên tục, tránh lỗi translateX(-50%) CSS
        (function initCarousel() {
            const track = document.getElementById('carouselTrack');
            if (!track) return;

            // Chờ ảnh load xong để tính đúng width
            let offset = 0;
            let paused = false;
            let halfWidth = 0;
            const SPEED = 2.0; // px mỗi frame — tăng/giảm để nhanh/chậm

            // Tính halfWidth = tổng width của 6 ảnh gốc (không tính bản clone)
            function calcHalf() {
                const items = track.querySelectorAll('.polaroid');
                const count = items.length; // 12 (6 gốc + 6 clone)
                const half = Math.floor(count / 2);
                let w = 0;
                for (let i = 0; i < half; i++) {
                    w += items[i].getBoundingClientRect().width + 24; // 24 = gap
                }
                halfWidth = w;
            }

            // Pause khi hover
            const wrapper = track.closest('.carousel-wrapper');
            if (wrapper) {
                wrapper.addEventListener('mouseenter', () => paused = true);
                wrapper.addEventListener('mouseleave', () => paused = false);
            }

            function tick() {
                if (!paused) {
                    offset += SPEED;
                    if (halfWidth > 0 && offset >= halfWidth) {
                        offset = 0; // nhảy về đầu — seamless vì clone giống hệt
                    }
                    track.style.transform = `translateX(${-offset}px)`;
                }
                requestAnimationFrame(tick);
            }

            // Đợi image-page active thì tính width (vì khi hidden width = 0)
            const observer = new MutationObserver(() => {
                const page = document.getElementById('image-page');
                if (page && page.classList.contains('active')) {
                    setTimeout(calcHalf, 50);
                }
            });
            const home = document.getElementById('home');
            if (home) observer.observe(home.parentElement, { subtree: true, attributeFilter: ['class'] });

            requestAnimationFrame(tick);
        })();

        function startLetter() {
            const el = document.getElementById('letterContent');
            el.innerHTML = '<span class="cursor"></span>';
            let i = 0;
            if (letterTimer) clearInterval(letterTimer);
            letterTimer = setInterval(() => {
                if (i >= letterText.length) { clearInterval(letterTimer); return; }
                const cursor = el.querySelector('.cursor');
                el.insertBefore(document.createTextNode(letterText[i]), cursor);
                i++;
            }, 35);
        }
    </script>
</body>

</html>
